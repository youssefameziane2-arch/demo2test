[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "demo2test"
version = "0.1.0"
description = "Turn a live GUI demonstration into an automated BDD test (Qt recorder + rules / retrieval / LLM abstraction + Gherkin generation)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Youssef Ameziane" }]
dependencies = ["PySide6>=6.6", "pytest>=8", "pytest-qt>=4.4", "pytest-bdd>=7"]

[project.optional-dependencies]
dev = ["ruff>=0.5"]

[project.scripts]
demo2test = "demo2test.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["eval/out"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "N", "UP"]
ignore = ["N802", "N815"]
