name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Qt system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Unit, integration and end-to-end tests
        run: pytest -q
      - name: Evaluation bench (rules / retrieval, reproducible)
        run: python eval/run_eval.py
      - name: Evaluation bench with the LLM (replayed from eval/llm_cache.json)
        run: python eval/run_eval.py --llm replay:eval/llm_cache.json
      - name: Publish evaluation results
        run: cat eval/RESULTS_llm.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: generated-features
          path: eval/out/rules_retrieval/
